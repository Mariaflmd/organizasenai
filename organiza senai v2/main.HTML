<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrganizaSenai - Login</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epunda+Sans:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Epunda+Sans:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1 class="titulo">OrganizaSenai</h1>
  </header>

  <main>
    <section class="form-container" id="login-form">
      <form action="">
      <h2>Faça o login:</h2>
      <label>Email:</label>
      <input type="email" id="login-email" required />
      <label>Senha:</label>
      <input type="password" id="login-password" required />
      <button type="button" onclick="login()">Enviar</button>
      <p id="mensagem"></p>
      <p><a href="#" onclick="showForgotPassword()">Esqueceu sua senha?</a></p>
      <p><a href="#" onclick="showRegister()">Cadastrar-se</a></p>
    </form>
    </section>

    <section class="form-container hidden" id="register-form">
      <h2>Cadastre-se:</h2>
      <label>Nome:</label>
      <input type="text" id="register-name" required />
      <label>Email:</label>
      <input type="email" id="register-email" required />
      <label>Senha:</label>
      <input type="password" id="register-password" required />
      <button onclick="register()">Cadastrar</button>
      <p><a href="#" onclick="showLogin()">Já tem conta? Fazer login</a></p>
    </section>

    <section class="form-container hidden" id="forgot-password-form">
      <h2>Recuperar Senha:</h2>
      <label>Digite seu e-mail:</label>
      <input type="email" id="forgot-email" required />
      <button onclick="recoverPassword()">Enviar</button>
      <p><a href="#" onclick="showLogin()">Voltar ao login</a></p>
    </section>

  </main>

  <script src="main.js"></script>
</body>
</html>
